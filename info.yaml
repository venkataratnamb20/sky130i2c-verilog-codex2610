# Tiny Tapeout project information
project:
  title:        "I2C RAM Slave"
  author:       "venkataratnamb20"
  discord:      ""
  description:  "16-byte I2C target RAM with a strap-selected address"
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_venkataratnamb20_i2c"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "i2c_slave_ram.v"
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "RAM write data bit 0"
  ui[1]: "RAM write data bit 1"
  ui[2]: "RAM write data bit 2"
  ui[3]: "RAM write data bit 3"
  ui[4]: "RAM write data bit 4"
  ui[5]: "RAM write data bit 5"
  ui[6]: "RAM write data bit 6"
  ui[7]: "RAM write data bit 7"

  # Outputs
  uo[0]: "Latched read byte bit 0"
  uo[1]: "Latched read byte bit 1"
  uo[2]: "Latched read byte bit 2"
  uo[3]: "Latched read byte bit 3"
  uo[4]: "Latched read byte bit 4"
  uo[5]: "Latched read byte bit 5"
  uo[6]: "Latched read byte bit 6"
  uo[7]: "Latched read byte bit 7"

  # Bidirectional pins
  uio[0]: "SCL input"
  uio[1]: "SDA open-drain"
  uio[2]: "Address select"
  uio[3]: "RAM write enable"
  uio[4]: "RAM write address bit 0"
  uio[5]: "RAM write address bit 1"
  uio[6]: "RAM write address bit 2"
  uio[7]: "RAM write address bit 3"

# Do not change!
yaml_version: 6
